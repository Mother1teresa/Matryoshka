name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Create .env file
        run: |
          cat > .env <<EOF
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=matreshka-28074.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=matreshka-28074
          VITE_FIREBASE_STORAGE_BUCKET=matreshka-28074.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID=788752225889
          VITE_FIREBASE_APP_ID=1:788752225889:web:4c3f06ba5a20ec67583c20
          VITE_FIREBASE_VAPID_KEY=${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_VK_APP_ID=${{ secrets.VITE_VK_APP_ID }}
          EOF

      - name: Generate firebase-messaging-sw.js
        run: |
          mkdir -p public
          cat > public/firebase-messaging-sw.js <<'EOF'
          importScripts('https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js');
          importScripts('https://www.gstatic.com/firebasejs/10.13.0/firebase-messaging-compat.js');

          firebase.initializeApp({
            apiKey: "${{ secrets.VITE_FIREBASE_API_KEY }}",
            authDomain: "matreshka-28074.firebaseapp.com",
            projectId: "matreshka-28074",
            storageBucket: "matreshka-28074.firebasestorage.app",
            messagingSenderId: "788752225889",
            appId: "1:788752225889:web:4c3f06ba5a20ec67583c20"
          });

          const messaging = firebase.messaging();

          messaging.onBackgroundMessage((payload) => {
            const { title, body, image } = payload.notification || {};
            const data = payload.data || {};
            self.registration.showNotification(title || 'Уведомление', {
              body: body || '',
              icon: '/icon-192x192.png',
              badge: '/icon-96x96.png',
              image: image || undefined,
              tag: data.tag || 'general',
              renotify: false,
              requireInteraction: false,
              data: { url: data.url || '/notifications', messageId: data.messageId },
            });
          });
          self.addEventListener('push', (event) => {
            if (!event.data) return;
            const payload = event.data.json();
            const { title, body } = payload.notification || {};
            event.waitUntil(
              self.registration.showNotification(title || 'Уведомление', {
                body: body || '',
                icon: '/icon-192x192.png',
                data: { url: payload.data?.url || '/notifications' },
              })
            );
          });

          self.addEventListener('notificationclick', (event) => {
            event.notification.close();
            const url = event.notification.data?.url || '/notifications';
            event.waitUntil(
              clients.matchAll({ type: 'window', includeUncontrolled: true }).then((windowClients) => {
                for (const client of windowClients) {
                  if (client.url.includes(url) && 'focus' in client) return client.focus();
                }
                for (const client of windowClients) {
                  if (new URL(client.url).origin === self.location.origin && 'navigate' in client) {
                    return client.navigate(url).then(c => c.focus());
                  }
                }
                if (clients.openWindow) return clients.openWindow(url);
              }).catch(() => clients.openWindow('/'))
            );
          });
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', (e) => e.waitUntil(clients.claim()));
          EOF

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Verify SW in dist
        run: |
          test -f dist/firebase-messaging-sw.js && echo "✅ SW найден" || (echo "❌ SW потерян" && exit 1)
      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete
          path: dist/
          remote_path: /var/www/html/
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl reload nginx || true
            echo "Deployed at $(date)"