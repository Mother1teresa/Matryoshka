name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Create .env file
        run: |
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" > .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=matreshka-28074.firebaseapp.com" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=matreshka-28074" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=matreshka-28074.firebasestorage.app" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=788752225889" >> .env
          echo "VITE_FIREBASE_APP_ID=1:788752225889:web:4c3f06ba5a20ec67583c20" >> .env
          echo "VITE_FIREBASE_VAPID_KEY=${{ secrets.VITE_FIREBASE_VAPID_KEY }}" >> .env
          echo "VITE_VK_APP_ID=${{ secrets.VITE_VK_APP_ID }}" >> .env

      - name: Create firebase-messaging-sw.js
        run: |
          mkdir -p public
          cat > public/firebase-messaging-sw.js <<'EOF'
          importScripts('https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js');
          importScripts('https://www.gstatic.com/firebasejs/10.13.0/firebase-messaging-compat.js');

          firebase.initializeApp({
            apiKey: "${{ secrets.VITE_FIREBASE_API_KEY }}",
            authDomain: "matreshka-28074.firebaseapp.com",
            projectId: "matreshka-28074",
            storageBucket: "matreshka-28074.firebasestorage.app",
            messagingSenderId: "788752225889",
            appId: "1:788752225889:web:4c3f06ba5a20ec67583c20"
          });

          const messaging = firebase.messaging();

          messaging.onBackgroundMessage((payload) => {
            const { title, body } = payload.notification || {};
            self.registration.showNotification(title || 'Уведомление', {
              body: body || '',
              icon: '/icon-192x192.png',
              badge: '/icon-96x96.png',
              data: { url: payload.data?.url || '/notifications' },
              requireInteraction: true
            });
          });

          self.addEventListener('notificationclick', (event) => {
            event.notification.close();
            const url = event.notification.data?.url || '/notifications';
            event.waitUntil(
              clients.matchAll({ type: 'window', includeUncontrolled: true }).then((windowClients) => {
                for (const client of windowClients) {
                  if (client.url.includes(url) && 'focus' in client) return client.focus();
                }
                if (clients.openWindow) return clients.openWindow(url);
              })
            );
          });
          EOF

      - name: Install dependencies and Build
        run: |
          npm ci
          npm run build

      - name: Verify service worker exists
        run: |
          test -f dist/firebase-messaging-sw.js && echo "✅ SW найден" || (echo "❌ SW не найден" && exit 1)

      - name: Clear server directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            rm -rf /var/www/html/*
            mkdir -p /var/www/html

      - name: Deploy to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "dist/*"
          target: "/var/www/html"
          strip_components: 0